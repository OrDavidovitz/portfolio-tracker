version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: or_d
      POSTGRES_PASSWORD: "myStrongPass!"
      POSTGRES_DB: portfolio_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U or_d -d portfolio_dev"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: